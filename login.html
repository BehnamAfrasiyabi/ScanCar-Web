<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود و عضویت | ScanCar</title>
  <meta name="description" content="ورود یا ثبت‌نام در حساب کاربری ScanCar با شماره موبایل" />
  <link rel="canonical" href="https://scancar.ir/login.html" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#000; --card:#111; --text:#fff; --muted:#a0a0a0; --accent:#ff2d2d;
      --border:#222; --ok:#00c853;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;flex-direction:column;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,45,45,0.12), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0,255,136,0.05), transparent 35%);
    }
    a{color:var(--accent);text-decoration:none}
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 20px;border-bottom:1px solid var(--border);
    }
    .logo{font-weight:800;font-size:20px;color:#fff}
    .logo span{color:var(--accent)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
    .box{
      width:100%;max-width:420px;background:var(--card);
      border:1px solid var(--border);border-radius:20px;padding:28px 24px;
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }
    h1{font-size:1.45rem;margin-bottom:6px;text-align:center}
    .sub{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:20px}
    .tabs{display:flex;gap:8px;margin-bottom:20px;background:#0a0a0a;padding:4px;border-radius:999px;border:1px solid var(--border)}
    .tabs button{
      flex:1;padding:10px;border:none;border-radius:999px;background:transparent;
      color:var(--muted);font-family:inherit;font-weight:600;cursor:pointer;font-size:14px;
    }
    .tabs button.on{background:linear-gradient(135deg,#ff4d4d,#cc0000);color:#fff}
    label{display:block;font-size:0.85rem;color:var(--muted);margin:12px 0 6px}
    input{
      width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
      background:#0a0a0a;color:#fff;font-family:inherit;font-size:15px;
    }
    .actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
    button.primary{
      width:100%;padding:13px;border:none;border-radius:999px;
      background:linear-gradient(135deg,#ff4d4d,#cc0000);color:#fff;
      font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;
    }
    button.secondary{
      width:100%;padding:12px;border-radius:999px;border:1px solid var(--border);
      background:transparent;color:#fff;font-family:inherit;font-weight:600;cursor:pointer;
    }
    button:disabled{opacity:0.5;cursor:not-allowed}
    .msg{padding:12px;border-radius:10px;margin:12px 0;font-size:0.88rem;display:none}
    .msg.show{display:block}
    .msg.err{background:rgba(255,45,45,0.12);border:1px solid var(--accent)}
    .msg.ok{background:rgba(0,200,83,0.12);border:1px solid var(--ok)}
    .hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}
    .hidden{display:none!important}
    .otp-row{display:none}
    .otp-row.show{display:block}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">SCAN<span>CAR</span></a>
    <a href="shop.html" style="color:var(--muted);font-size:14px">فروشگاه</a>
  </header>

  <main>
    <div class="box">
      <h1 id="title">ورود به حساب</h1>
      <p class="sub" id="subtitle">با شماره موبایل وارد شوید یا عضو شوید</p>

      <div class="tabs">
        <button type="button" id="tabLogin" class="on">ورود</button>
        <button type="button" id="tabRegister">عضویت</button>
      </div>

      <div id="alert" class="msg"></div>

      <label for="phone">شماره موبایل</label>
      <input id="phone" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" autocomplete="tel" />

      <div id="nameField" class="hidden">
        <label for="name">نام و نام خانوادگی (اختیاری)</label>
        <input id="name" type="text" placeholder="مثلاً بهنام افراسیابی" maxlength="80" />
      </div>

      <div class="otp-row" id="otpRow">
        <label for="otp">کد تأیید پیامک</label>
        <input id="otp" type="text" inputmode="numeric" placeholder="کد ۶ رقمی" maxlength="6" autocomplete="one-time-code" />
      </div>

      <div class="actions">
        <button type="button" class="primary" id="btnRequest">دریافت کد تأیید</button>
        <button type="button" class="primary hidden" id="btnVerify">تأیید و ورود به حساب</button>
        <button type="button" class="secondary hidden" id="btnResend">ارسال مجدد کد</button>
      </div>

      <p class="hint">
        با تأیید شماره موبایل، حساب شما ساخته یا باز می‌شود.<br />
        در حالت آزمایشی کد در لاگ سرور Backend دیده می‌شود.
      </p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      const mode = { value: 'login' }; // login | register
      const next = ScanCarAuth.queryParam('next') || 'account.html';

      // Already logged in → account
      if (ScanCarAuth.getToken()) {
        ScanCarAuth.me()
          .then(function () { location.replace(next.indexOf('.html') >= 0 ? next : 'account.html'); })
          .catch(function () { ScanCarAuth.setToken(null); });
      }

      function alert(msg, ok) {
        const el = document.getElementById('alert');
        el.className = 'msg show ' + (ok ? 'ok' : 'err');
        el.textContent = msg;
      }

      function setMode(m) {
        mode.value = m;
        document.getElementById('tabLogin').classList.toggle('on', m === 'login');
        document.getElementById('tabRegister').classList.toggle('on', m === 'register');
        document.getElementById('title').textContent = m === 'login' ? 'ورود به حساب' : 'عضویت در ScanCar';
        document.getElementById('subtitle').textContent =
          m === 'login'
            ? 'اگر قبلاً عضو شده‌اید، با همان شماره وارد شوید'
            : 'ثبت‌نام سریع فقط با شماره موبایل';
        document.getElementById('nameField').classList.toggle('hidden', m !== 'register');
        document.getElementById('btnVerify').textContent =
          m === 'login' ? 'تأیید و ورود به حساب' : 'تأیید و ساخت حساب';
      }

      document.getElementById('tabLogin').onclick = function () { setMode('login'); };
      document.getElementById('tabRegister').onclick = function () { setMode('register'); };

      // deep-link: login.html?mode=register
      if (ScanCarAuth.queryParam('mode') === 'register') setMode('register');

      async function sendOtp() {
        const phone = document.getElementById('phone').value.trim();
        if (!/^09\d{9}$/.test(phone)) {
          alert('شماره موبایل را به صورت 09xxxxxxxxx وارد کنید', false);
          return;
        }
        try {
          const data = await ScanCarAuth.requestOtp(phone);
          document.getElementById('otpRow').classList.add('show');
          document.getElementById('btnRequest').classList.add('hidden');
          document.getElementById('btnVerify').classList.remove('hidden');
          document.getElementById('btnResend').classList.remove('hidden');
          alert(data.message || 'کد تأیید ارسال شد', true);
          document.getElementById('otp').focus();
        } catch (e) {
          alert(e.message, false);
        }
      }

      async function verify() {
        const phone = document.getElementById('phone').value.trim();
        const code = document.getElementById('otp').value.trim();
        if (code.length !== 6) {
          alert('کد ۶ رقمی را وارد کنید', false);
          return;
        }
        try {
          const data = await ScanCarAuth.verifyOtp(phone, code);
          const name = document.getElementById('name').value.trim();
          if (mode.value === 'register' && name) {
            try { await ScanCarAuth.updateProfile({ name: name }); } catch (_) {}
          }
          alert('ورود موفق — در حال انتقال…', true);
          setTimeout(function () {
            location.href = next.indexOf('.html') >= 0 ? next : 'account.html';
          }, 400);
        } catch (e) {
          alert(e.message, false);
        }
      }

      document.getElementById('btnRequest').onclick = sendOtp;
      document.getElementById('btnResend').onclick = sendOtp;
      document.getElementById('btnVerify').onclick = verify;
      document.getElementById('otp').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') verify();
      });
    })();
  </script>
</body>
</html>
