<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود یا عضویت | ScanCar</title>
  <meta name="description" content="ورود یا ثبت‌نام در حساب کاربری ScanCar با شماره موبایل" />
  <link rel="canonical" href="https://scancar.ir/login.html" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#000; --card:#111; --text:#fff; --muted:#a0a0a0; --accent:#ff2d2d;
      --border:#222; --ok:#00c853;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;flex-direction:column;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,45,45,0.12), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0,255,136,0.05), transparent 35%);
    }
    a{color:var(--accent);text-decoration:none}
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 20px;border-bottom:1px solid var(--border);
    }
    .logo{font-weight:800;font-size:20px;color:#fff}
    .logo span{color:var(--accent)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
    .box{
      width:100%;max-width:420px;background:var(--card);
      border:1px solid var(--border);border-radius:20px;padding:28px 24px;
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }
    h1{font-size:1.35rem;margin-bottom:6px;text-align:center}
    .sub{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:20px}
    label{display:block;font-size:0.85rem;color:var(--muted);margin:12px 0 6px}
    input{
      width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
      background:#0a0a0a;color:#fff;font-family:inherit;font-size:15px;
    }
    input:focus{outline:none;border-color:var(--accent)}
    input.invalid{border-color:var(--accent);background:rgba(255,45,45,0.06)}
    .fielderr{font-size:12px;color:var(--accent);margin-top:5px;display:none}
    .fielderr.show{display:block}
    .actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
    button.primary{
      width:100%;padding:13px;border:none;border-radius:999px;
      background:linear-gradient(135deg,#ff4d4d,#cc0000);color:#fff;
      font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;
    }
    button.secondary{
      width:100%;padding:12px;border-radius:999px;border:1px solid var(--border);
      background:transparent;color:#fff;font-family:inherit;font-weight:600;cursor:pointer;
    }
    button:disabled{opacity:0.5;cursor:not-allowed}
    .msg{padding:12px;border-radius:10px;margin:12px 0;font-size:0.88rem;display:none}
    .msg.show{display:block}
    .msg.err{background:rgba(255,45,45,0.12);border:1px solid var(--accent)}
    .msg.ok{background:rgba(0,200,83,0.12);border:1px solid var(--ok)}
    .hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
    .hidden{display:none!important}
    .otp-row.show{display:block}
    .otp-row{display:none}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">SCAN<span>CAR</span></a>
    <a href="shop.html" style="color:var(--muted);font-size:14px">فروشگاه</a>
  </header>

  <main>
    <div class="box">
      <h1>ورود یا عضویت</h1>
      <p class="sub">جهت شروع، شماره موبایل خود را وارد کنید</p>

      <div id="alert" class="msg"></div>

      <label for="phone">شماره موبایل</label>
      <input id="phone" type="tel" inputmode="numeric" dir="ltr" placeholder="09xxxxxxxxx" maxlength="14" autocomplete="tel" />
      <div class="fielderr" id="phoneErr">شماره موبایل معتبر نیست — مثلاً 09123456789</div>

      <div class="otp-row" id="otpRow">
        <label for="otp">کد تأیید پیامک‌شده</label>
        <input id="otp" type="text" inputmode="numeric" dir="ltr" placeholder="- - - - - -" maxlength="6" autocomplete="one-time-code" />
        <div class="fielderr" id="otpErr">کد ۶ رقمی را وارد کنید</div>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="btnRequest">دریافت کد تأیید</button>
        <button type="button" class="primary hidden" id="btnVerify">تأیید و ورود</button>
        <button type="button" class="secondary hidden" id="btnResend">ارسال مجدد کد</button>
        <button type="button" class="secondary hidden" id="btnEditPhone">تغییر شماره موبایل</button>
      </div>

      <p class="hint" id="hint">
        اگر قبلاً عضو شده‌اید، با همین شماره وارد حساب خود می‌شوید؛<br />
        در غیر این صورت حساب جدید برای شما ساخته می‌شود.
      </p>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      const next = ScanCarAuth.queryParam('next') || 'account.html';
      const goNext = function () { location.href = next.indexOf('.html') >= 0 ? next : 'account.html'; };

      // Already logged in → continue where the user came from
      if (ScanCarAuth.getToken()) {
        ScanCarAuth.me()
          .then(goNext)
          .catch(function () { ScanCarAuth.setToken(null); });
      }

      const el = function (id) { return document.getElementById(id); };

      function alertBox(msg, ok) {
        const box = el('alert');
        box.className = 'msg show ' + (ok ? 'ok' : 'err');
        box.textContent = msg;
      }
      function alertHide() { el('alert').className = 'msg'; }

      function markPhone(bad) {
        el('phone').classList.toggle('invalid', bad);
        el('phoneErr').classList.toggle('show', bad);
      }
      function markOtp(bad) {
        el('otp').classList.toggle('invalid', bad);
        el('otpErr').classList.toggle('show', bad);
      }

      let pendingPhone = '';

      async function sendOtp() {
        alertHide(); markPhone(false);
        const raw = el('phone').value;
        const phone = ScanCarAuth.normalizePhone(raw);
        if (!phone) { markPhone(true); el('phone').focus(); return; }
        pendingPhone = phone;
        const btn = el('btnRequest'); btn.disabled = true;
        try {
          await ScanCarAuth.requestOtp(phone);
          el('otpRow').classList.add('show');
          el('btnRequest').classList.add('hidden');
          el('btnVerify').classList.remove('hidden');
          el('btnResend').classList.remove('hidden');
          el('btnEditPhone').classList.remove('hidden');
          el('phone').readOnly = true;
          el('hint').innerHTML = 'کد ۶ رقمی به شماره <b dir="ltr">' + phone + '</b> پیامک شد.<br />کد را وارد کنید.';
          alertBox('کد تأیید پیامک شد — تا ۵ دقیقه اعتبار دارد.', true);
          el('otp').focus();
        } catch (e) {
          alertBox(e.code === 'INVALID_PHONE' ? e.message : 'ارسال کد ناموفق بود: ' + (e.message || 'دوباره تلاش کنید'), false);
        }
        btn.disabled = false;
      }

      async function verify() {
        alertHide(); markOtp(false);
        const code = el('otp').value.replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }).trim();
        if (code.length !== 6) { markOtp(true); el('otp').focus(); return; }
        const btn = el('btnVerify'); btn.disabled = true;
        try {
          await ScanCarAuth.verifyOtp(pendingPhone, code);
          alertBox('ورود موفق — در حال انتقال…', true);
          setTimeout(goNext, 400);
        } catch (e) {
          alertBox(e.status === 401
            ? 'کد وارد شده درست یا معتبر نیست — دوباره بررسی کنید.'
            : 'تأیید ناموفق بود: ' + (e.message || 'دوباره تلاش کنید'), false);
          btn.disabled = false;
        }
      }

      function editPhone() {
        el('otpRow').classList.remove('show');
        el('btnVerify').classList.add('hidden');
        el('btnResend').classList.add('hidden');
        el('btnEditPhone').classList.add('hidden');
        el('btnRequest').classList.remove('hidden');
        el('phone').readOnly = false;
        el('phone').focus();
        alertHide();
        el('hint').innerHTML =
          'اگر قبلاً عضو شده‌اید، با همین شماره وارد حساب خود می‌شوید؛<br />در غیر این صورت حساب جدید برای شما ساخته می‌شود.';
      }

      el('btnRequest').onclick = sendOtp;
      el('btnResend').onclick = sendOtp;
      el('btnVerify').onclick = verify;
      el('btnEditPhone').onclick = editPhone;
      el('phone').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') sendOtp(); });
      el('otp').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') verify(); });
      el('phone').addEventListener('input', function () { markPhone(false); });
      el('otp').addEventListener('input', function () { markOtp(false); });
    })();
  </script>
</body>
</html>
