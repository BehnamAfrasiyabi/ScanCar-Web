<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060608">
<meta name="description" content="دیاگ S1 — دستگاه تشخیص خطای حرفه‌ای خودرو، سازگار با تمام خودروهای داخلی">
<title>SCAN CAR</title>
<link rel="icon" type="image/svg+xml" href="images/logo-red.svg">
<link rel="apple-touch-icon" href="images/logo-red.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2233;--red-deep:#c00d20;--bg:#060608;--text:#f4f4f7;--muted:#a7adba}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{height:100vh;height:100dvh;overflow:hidden;font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;position:relative;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:#fff}
button{font-family:inherit;cursor:pointer}
img{display:block}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 25%,transparent 78%)}
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.glow-a{width:min(58vw,720px);aspect-ratio:1;right:-12%;top:-14%;background:radial-gradient(circle,rgba(255,34,51,.16),transparent 62%)}
.glow-b{width:min(42vw,520px);aspect-ratio:1;left:-12%;bottom:-22%;background:radial-gradient(circle,rgba(255,34,51,.09),transparent 65%)}
.bg-word{position:fixed;bottom:-8vh;left:-1vw;z-index:0;direction:ltr;font-size:clamp(170px,26vw,380px);font-weight:900;font-style:italic;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.045);user-select:none;pointer-events:none}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.topbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:clamp(14px,2.4vh,24px) clamp(18px,4vw,52px);animation:fadeDown .8s ease both}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text);direction:ltr}
.logo-img{width:48px;height:48px;border-radius:13px;object-fit:cover;flex:none;box-shadow:0 0 20px rgba(255,34,51,.35);border:1px solid rgba(255,34,51,.35)}
.logo-text strong{font-size:1.08rem;font-weight:900;letter-spacing:.16em}
.logo-text em{font-style:normal;color:var(--red)}
.btn-login{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#e8e9ee;font-size:.88rem;font-weight:600;backdrop-filter:blur(8px);transition:border-color .25s,box-shadow .25s,transform .2s,background .25s}
.btn-login:hover{border-color:rgba(255,34,51,.45);background:rgba(255,34,51,.1);box-shadow:0 0 24px rgba(255,34,51,.2)}
.main{position:relative;z-index:2;flex:1;display:grid;place-items:center;padding:0 clamp(18px,4vw,52px) clamp(20px,4vh,40px);overflow:hidden}
.hero{max-width:1100px;width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,56px);align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr;text-align:center}.hero-visual{order:-1;max-width:320px;margin:0 auto}}
.hero h1{font-size:clamp(1.8rem,4.2vw,3.1rem);font-weight:900;line-height:1.25;margin-bottom:14px}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted);font-size:clamp(.95rem,1.5vw,1.12rem);line-height:1.75;margin-bottom:28px}
.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:14px;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;font-weight:700;font-size:1rem;border:none;box-shadow:0 8px 32px rgba(255,34,51,.4);transition:transform .2s,box-shadow .25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,34,51,.5)}
.hero-visual img{width:100%;height:auto;filter:drop-shadow(0 20px 50px rgba(255,34,51,.25));animation:rise 1s ease both .2s}
.footer{position:relative;z-index:5;text-align:center;padding:12px;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>
<div class="bg-word" aria-hidden="true">SCAN</div>
<header class="topbar">
  <a class="logo" href="#" aria-label="SCAN CAR">
    <img class="logo-img" src="images/logo-red.svg" alt="SCANCAR" width="48" height="48">
    <span class="logo-text"><strong>SCAN<em>CAR</em></strong></span>
  </a>
  <button class="btn-login" type="button">ورود / ثبت‌نام</button>
</header>
<main class="main">
  <div class="hero">
    <div class="hero-copy">
      <h1>دیاگ هوشمند <span>S1</span><br>برای تمام خودروهای داخلی</h1>
      <p>دستگاه تشخیص خطای حرفه‌ای ScanCar با پشتیبانی از ECUهای ایران‌خودرو، سایپا و خودروهای چینی. اتصال سریع، عیب‌یابی دقیق و به‌روزرسانی آنلاین.</p>
      <button class="cta" type="button">شروع کار با S1</button>
    </div>
    <div class="hero-visual">
      <img src="images/Product_S1.png" alt="دستگاه دیاگ S1" draggable="false">
    </div>
  </div>
</main>
<footer class="footer">© 2026 SCAN CAR — همه حقوق محفوظ است</footer>
</body>
</html>
